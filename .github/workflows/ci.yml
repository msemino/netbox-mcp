name: CI

# The README claims the tools return specific sentences in specific failure modes.
# `tests/check_error_strings.py` is the check behind that claim: it starts a stub NetBox in
# each mode (200 / 403 / 500 / connection refused / read timeout), calls all five tools, and
# asserts the returned text. It needs no NetBox and no network — that is why it can run here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  error-strings:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -r requirements.txt

      - name: The server module must import
        run: python -c "import sys; sys.path.insert(0, 'src'); import server; print('server imports')"

      - name: Error strings match the README, in every failure mode
        run: python tests/check_error_strings.py
