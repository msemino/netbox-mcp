name: CI

# The README claims the tools return specific sentences in specific failure modes.
# `tests/check_error_strings.py` is the check behind that claim: it starts a stub NetBox in
# each mode (200 / 403 / 500 / connection refused / read timeout), calls all five tools, and
# asserts the returned text. It needs no NetBox and no network — that is why it can run here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  error-strings:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -r requirements.txt

      # No separate import smoke test: server.py reads its configuration at import time and
      # exits if NETBOX_TOKEN is missing, which is the behaviour you want and the wrong thing
      # to assert with a bare import. The check below imports it 25 times, with config set.
      - name: Error strings match the README, in every failure mode
        run: python tests/check_error_strings.py
